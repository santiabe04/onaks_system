# Production: added on top of docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Uses the published images (APP_IMAGE:APP_VERSION) instead of building, does not
# publish the database or app ports (only Caddy gets in, on 80/443), and adds the proxy with HTTPS and the automatic backups. See docs/instalacion.md.

services:
  db:
    # The database is not published: only the other services can see it.
    ports: !reset []

  migrate:
    image: ${APP_IMAGE:-ghcr.io/santiabe04/onaks_system}-migrator:${APP_VERSION:?Falta APP_VERSION en el .env}

  app:
    image: ${APP_IMAGE:-ghcr.io/santiabe04/onaks_system}:${APP_VERSION:?Falta APP_VERSION en el .env}
    # No published port: if it were left open, someone could get in without going through
    # Caddy and send a fake X-Forwarded-For (login lock, audit log).
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    # The TLS mode picks the Caddyfile: auto | custom | proxy.
    command:
      [
        "caddy",
        "run",
        "--config",
        "/etc/caddy/${TLS_MODE:-auto}.Caddyfile",
        "--adapter",
        "caddyfile",
      ]
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en el .env}
      # Certificate notices (Let's Encrypt/ZeroSSL). Not used in the other modes, but still required.
      ACME_EMAIL: ${ACME_EMAIL:?Falta ACME_EMAIL en el .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      # Only for TLS_MODE=custom (otherwise it can be empty).
      - ./certs:/certs:ro
      # Issued certificates and Caddy state: do not delete (Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
      # Server folder: copy it somewhere outside the server too (see the guide).
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
