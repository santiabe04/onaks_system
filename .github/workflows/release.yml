name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['app--release_created'] }}
      version: ${{ steps.release.outputs['app--version'] }}
      tag_name: ${{ steps.release.outputs['app--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          APP_TAGS="${IMAGE}:${VERSION}"
          MIGRATOR_TAGS="${IMAGE}-migrator:${VERSION}"
          if [[ "$VERSION" != *-* ]]; then
            APP_TAGS="${APP_TAGS},${IMAGE}:latest"
            MIGRATOR_TAGS="${MIGRATOR_TAGS},${IMAGE}-migrator:latest"
          fi
          echo "app=${APP_TAGS}" >> "$GITHUB_OUTPUT"
          echo "migrator=${MIGRATOR_TAGS}" >> "$GITHUB_OUTPUT"
      - name: App build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          target: runner
          push: true
          tags: ${{ steps.tags.outputs.app }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # Sin cache gha: en eventos pull_request queda atada al ref del PR y no se reutiliza.
      # El migrator reutiliza la etapa deps del build anterior (mismo builder).
      - name: Migrator build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          target: migrator
          push: true
          tags: ${{ steps.tags.outputs.migrator }}
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
  cleanup-branch:
      needs: [release-please, publish-image]
      if: ${{ needs.release-please.outputs.release_created == 'true' }}
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Delete release-please branch
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            gh api -X DELETE \
              repos/${{ github.repository }}/git/refs/heads/release-please--branches--main--components--onaks_system \
              || echo "Branch deleted"
