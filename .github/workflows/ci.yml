name: CI - PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'

  conventional-commits:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check PR commits
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Check PR title
        run: echo "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  app-checks:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SESSION_SECRET: ci-only-secret
      SEED_ADMIN_MAIL: admin@ci.local
      SEED_ADMIN_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations + seed
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Migrations match with schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build

  docker:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -base64 32)|" .env
      - name: Validate production config
        # El compose de producción y los Caddyfile de los tres modos de TLS se
        # validan sin levantar nada (los valores son de ejemplo).
        env:
          DOMAIN: pedidos.example.com
          ACME_EMAIL: ci@example.com
          APP_VERSION: ci
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          for mode in auto custom proxy; do
            docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" \
              -e DOMAIN -e ACME_EMAIL -e TRUSTED_PROXIES=private_ranges \
              caddy:2.10.2-alpine \
              caddy adapt --config "/etc/caddy/$mode.Caddyfile" --adapter caddyfile > /dev/null
            echo "Caddyfile $mode OK"
          done
      - name: Image Build
        run: docker compose build
      - name: Start stack
        run: docker compose up -d app
      - name: Wait for HealthCheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 3
          done
          echo "HEALTHCHECK failed"
          exit 1
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  ci-ok:
    if: always()
    needs: [changes, conventional-commits, app-checks, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CHECK FAILED"; exit 1
          fi
          echo "CHECKS PASSED"
